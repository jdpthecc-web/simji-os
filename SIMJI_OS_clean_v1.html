<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>심지OS · 오늘의 루프</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
.mic{border:1.5px solid var(--line);background:#fff;border-radius:12px;min-width:46px;font-size:18px;cursor:pointer;flex-shrink:0;font-family:inherit}
.mic:active{background:var(--mint-soft)}
body,h1,h2,h3,p,div,button,li{word-break:keep-all}
:root{
  --navy:#1A2E4A; --teal:#0F766E; --mint:#9FE1CB; --mint-soft:#E1F5EE;
  --ink:#13202F; --muted:#64748B; --line:#E2E8F0; --bg:#F7FAF9; --card:#FFFFFF;
  --brain:#378ADD; --heart:#D4537E; --wisdom:#BA7517; --action:#639922;
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'IBM Plex Sans KR',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.wrap{max-width:440px;margin:0 auto;min-height:100vh;background:var(--bg);padding:0 16px 96px}
.serif{font-family:'Gowun Batang',serif}
.han{font-family:'Gowun Batang',serif;font-weight:700}
.topbar{padding:18px 4px 8px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:15px;font-weight:700;color:var(--navy);letter-spacing:.2px}
.brand small{color:var(--teal);font-weight:500}
.sub{color:var(--muted);font-size:13px}
.sc{display:none;animation:fade .25s ease}
.sc.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:15px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
.btn-primary{background:var(--navy);color:#fff}
.btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--navy)}
.btn:active{transform:scale(.99)}
/* 오늘의 루프 헤더 카드 */
.loop-hero{background:linear-gradient(135deg,var(--navy),var(--teal));border-radius:20px;padding:22px;color:#fff;margin-bottom:14px}
.loop-hero h1{font-size:20px;margin:0 0 2px;font-weight:700}
.loop-hero p{margin:0;color:var(--mint);font-size:13px}
.streak{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;margin-top:14px}
/* 루프 단계 행 */
.loop{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.stage{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;transition:border-color .15s}
.stage:active{border-color:var(--teal)}
.stage .dot{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;flex-shrink:0}
.stage .meta{flex:1;min-width:0}
.stage .meta b{display:block;font-size:15px;color:var(--ink)}
.stage .meta span{font-size:12px;color:var(--muted)}
.stage .chk{font-size:13px;font-weight:700;color:var(--teal)}
.stage.done{opacity:.7}
.stage.locked{opacity:.5;cursor:default}
/* 단계 화면 공통 */
.stage-head{display:flex;align-items:center;gap:12px;margin:8px 0 16px}
.stage-head .badge{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff}
.stage-head h2{margin:0;font-size:19px}
.stage-head .sub{margin:0}
.q{font-size:16px;font-weight:500;margin:18px 0 12px}
.scale{display:flex;gap:8px}
.scale button{flex:1;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px 0;font-size:22px;cursor:pointer;font-family:inherit}
.scale button.sel{border-color:var(--teal);background:var(--mint-soft)}
.coach{background:var(--mint-soft);border:1px solid var(--mint);border-radius:14px;padding:16px;margin-top:8px}
.coach .label{font-size:11px;font-weight:700;color:var(--teal);margin-bottom:6px}
.coach .interp{font-size:15px;color:var(--ink);margin-bottom:10px}
.coach .step{font-size:14px;color:var(--ink);background:#fff;border-radius:10px;padding:12px;border:1px solid var(--mint)}
.hint{font-size:12px;color:var(--muted);margin-top:10px;text-align:center}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;z-index:50;white-space:nowrap}
.toast.show{opacity:1}
textarea,input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-family:inherit;font-size:14px;resize:none}
textarea:focus,input:focus{outline:none;border-color:var(--teal)}
.marathon{background:linear-gradient(135deg,#7c4a03,#BA7517);color:#fff;border-radius:14px;padding:16px;margin-bottom:12px;line-height:1.4}
.marathon b{font-size:24px}
.rlog{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.rlog b{font-size:14px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rlog span{font-size:11px;color:var(--muted);flex-shrink:0;margin-left:10px}
.nonmed{font-size:11px;color:var(--muted);text-align:center;margin-top:18px;line-height:1.5}
/* ---- 디테일: 오버레이 / 주간 도장 / 실천 칩 / 축하 ---- */
.ovl{position:fixed;inset:0;background:rgba(19,28,40,.55);display:flex;align-items:center;justify-content:center;z-index:90;padding:24px}
.ovl-card{background:#fff;border-radius:22px;padding:28px 22px;max-width:360px;width:100%;text-align:center;position:relative;overflow:hidden}
.ovl-card h2{font-family:'Gowun Batang',serif;color:var(--navy);font-size:22px;margin-bottom:10px}
.ovl-card p{font-size:14px;color:var(--muted);line-height:1.7}
.ovl-card input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:16px;text-align:center;margin:14px 0;font-family:inherit}
.week{display:flex;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:14px}
.wd{text-align:center;font-size:10px;color:var(--muted)}
.wd .c{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;margin:0 auto 4px;font-size:12px;color:#fff}
.wd .c.l1{background:var(--mint);border-color:var(--mint)}
.wd .c.l2{background:var(--teal);border-color:var(--teal)}
.wd.today{color:var(--teal);font-weight:700}
.wd.today .c{border:2.5px solid var(--teal);box-shadow:0 0 0 3px var(--mint-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer;font-family:inherit}
.chip:active{background:var(--mint-soft);border-color:var(--mint)}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti span{position:absolute;top:100%;font-size:20px;animation:fly 1.6s ease-out forwards}
@keyframes fly{to{transform:translateY(-360px) rotate(360deg);opacity:0}}
.gear{cursor:pointer;font-size:16px;color:var(--muted);padding:4px 6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">심지OS <small>· 뇌심지동</small></div>
    <div style="display:flex;align-items:center;gap:4px">
      <div class="sub" id="role-label" onclick="toggleRole()" style="cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:3px 12px">학생 ▾</div>
      <div class="gear" onclick="openSettings()">⚙</div>
    </div>
  </div>

  <!-- 홈: 오늘의 루프 -->
  <div id="sc-home" class="sc on"></div>

  <!-- 腦 상태 -->
  <div id="sc-brain" class="sc"></div>

  <!-- 心 관계·마음 -->
  <div id="sc-heart" class="sc"></div>

  <!-- 智 의미·질문 -->
  <div id="sc-wisdom" class="sc"></div>

  <!-- 動 실천·복귀 -->
  <div id="sc-action" class="sc"></div>

  <!-- 부모 창 -->
  <div id="sc-parent" class="sc"></div>

  <!-- 나의 방 -->
  <div id="sc-myroom" class="sc"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   심지OS — 클린 빌드 v1 (오늘의 루프 골격 + 腦 상태 코치)
   구조: Config → Storage → StateIndex → AIClient → Guardrails → Loop → UI → Init
   ※ 인젝트 덧대기 없음. 각 영역이 한 곳에 모여 있어 수정이 쉽다.
   ========================================================================= */

/* ---------- Config ---------- */
const STAGES = [
  { key:'brain',  han:'腦', name:'상태',      desc:'오늘 배움의 문이 열렸나', color:'var(--brain)',  emoji:'🧠' },
  { key:'heart',  han:'心', name:'관계·마음', desc:'안전하게 마음을 나눈다',  color:'var(--heart)',  emoji:'💗' },
  { key:'wisdom', han:'智', name:'의미·질문', desc:'내 말로 다시, 질문하기',  color:'var(--wisdom)', emoji:'📖' },
  { key:'action', han:'動', name:'실천·복귀', desc:'작게 하나, 다시 돌아오기', color:'var(--action)', emoji:'🌱' },
];
const AI_ENDPOINT = '/ai';        // 서버 프록시(Gemini/Vertex) → 없으면 폴백
const METRICS_ENDPOINT = '/metrics/event';

/* ---------- Storage (localStorage, 하루 단위 루프 상태) ---------- */
const DB = {
  dreams(){ const d=this.load(); return d.dreams||[]; },
  currentDream(){ const ds=this.dreams(); return ds.length?ds[ds.length-1].text:''; },
  setDream(text){ const d=this.load(); if(!d.dreams) d.dreams=[]; d.dreams.push({date:this.today(), text:text}); this.save(d); },
  localDate(dt){ const d=dt||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); },
  today(){ return this.localDate(); },
  _key(){ return 'simji_clean_v1'; },
  load(){ try{ return JSON.parse(localStorage.getItem(this._key())) || {days:{},lastDay:null}; }catch(e){ return {days:{},lastDay:null}; } },
  save(d){ try{ localStorage.setItem(this._key(), JSON.stringify(d)); }catch(e){} },
  day(){ const d=this.load(); const t=this.today(); if(!d.days[t]) d.days[t]={ done:{}, stateIndex:null }; return d.days[t]; },
  setDay(day){ const d=this.load(); d.days[this.today()]=day; d.lastDay=this.today(); this.save(d); },
  markDone(stageKey, payload){ const day=this.day(); day.done[stageKey]=Object.assign({at:Date.now()}, payload||{}); this.setDay(day); },
  // 복귀 친화 연속일: '끊김'을 벌하지 않고, 활동한 날 수를 센다(연속이 끊겨도 0으로 깎지 않음)
  activeDays(){ const d=this.load(); return Object.keys(d.days).filter(k=>Object.keys(d.days[k].done||{}).length>0); },
  returnedAfterBreak(){
    const days=this.activeDays().sort(); if(days.length<2) return false;
    const prev=new Date(days[days.length-2]+'T00:00:00').getTime();
    const last=new Date(days[days.length-1]+'T00:00:00').getTime();
    return (last-prev) > 2*864e5; // 3일 이상 쉬었다가 돌아옴
  },
  // 리딩 마라톤: 하루 단위가 아니라 평생 누적되는 기록
  readingLog(){ const d=this.load(); return d.reading || []; },
  addReading(entry){ const d=this.load(); if(!d.reading) d.reading=[]; d.reading.push(Object.assign({date:this.today(),at:Date.now()},entry)); this.save(d); },
  parentMessages(){ const d=this.load(); return d.parentMsgs || []; },
  addParentMessage(m){ const d=this.load(); if(!d.parentMsgs) d.parentMsgs=[]; d.parentMsgs.push(Object.assign({date:this.today(),at:Date.now()},m)); this.save(d); },
  gratitudeCount(){ const d=this.load(); return (d.gratitudes||[]).length; },
  addGratitudes(arr){ const d=this.load(); if(!d.gratitudes) d.gratitudes=[]; const t=this.today(); arr.forEach(function(g){ d.gratitudes.push({date:t,at:Date.now(),text:g}); }); this.save(d); },
  recentStateIndices(n){ const d=this.load(); const out=Object.keys(d.days).sort().map(function(k){ return {date:k, idx:d.days[k].stateIndex}; }).filter(function(x){ return x.idx!=null; }); return out.slice(-(n||7)); },
  profile(){ const d=this.load(); return d.profile||null; },
  setProfile(name,band){ const d=this.load(); const id=(d.profile&&d.profile.id)||('c_'+Math.random().toString(36).slice(2,8)); d.profile={name:name,id:id,band:band||(d.profile&&d.profile.band)||'elem'}; this.save(d); },
  bestReaction(){ const d=this.load(); return d.bestRt||null; },
  setBestReaction(ms){ const d=this.load(); d.bestRt=ms; this.save(d); },
  last7(){ const d=this.load(); const out=[]; const names=['일','월','화','수','목','금','토'];
    for(let i=6;i>=0;i--){ const dt=new Date(Date.now()-i*864e5); const k=this.localDate(dt);
      const day=d.days[k]; const cnt=day?Object.keys(day.done||{}).length:0;
      out.push({date:k, label:names[dt.getDay()], level:cnt>=4?2:(cnt>0?1:0), today:i===0}); }
    return out; },
  readingMeters(){ const d=this.load(); return (d.reading||[]).reduce(function(a,e){ return a+(e.pages||0); },0)*5; }
};

/* ---------- StateIndex (투명한 규칙 기반) ----------
   AI가 숫자를 즉흥 생성하지 않는다. 지수는 입력의 가중합(설명 가능).
   입력원: 기본=자기보고(집중/컨디션). 추후 마이크로과제·HRV·EEG를 같은 자리에 끼움. */
function computeStateIndex(b){
  // 사용 가능한 신호만 가중 합산(설명 가능). 자기보고=항상, 반응속도/맥박=선택.
  const parts=[], weights=[];
  parts.push(((b.focus||3)/5*0.55 + (b.energy||3)/5*0.45)*100); weights.push(0.5);
  if(b.taskScore!=null){ parts.push(b.taskScore); weights.push(0.4); }
  const wsum=weights.reduce(function(a,c){return a+c;},0);
  let acc=0; for(let i=0;i<parts.length;i++){ acc+=parts[i]*weights[i]; }
  return Math.round(acc/wsum);
}

/* ---------- AIClient (서버 /ai 프록시; 실패 시 안전 템플릿 폴백) ---------- */
async function aiText(system, prompt){
  try{
    const r = await fetch(AI_ENDPOINT, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ model:'server', max_tokens:300, system:system, messages:[{role:'user', content:prompt}] })
    });
    if(!r.ok) return null;
    const d = await r.json();
    const raw=(d.content && d.content[0] && d.content[0].text) || null;
    return raw ? sanitizeAI(raw) : null;
  }catch(e){ return null; }
}
function logEvent(type, payload){
  try{ const p=DB.profile(); fetch(METRICS_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({type:type,date:DB.today(),childId:(p&&p.id)||'demo'},payload||{}))}).catch(function(){}); }catch(e){}
}

/* ---------- Guardrails (전 단계 공통 안전 규칙) ---------- */
const SAFE = {
  // 비의료·비교·자책 금지. 위험 신호 키워드 → 사람(보호자·상담)에게.
  riskHint(text){
    if(!text) return false;
    const k = ['죽','때려','맞았','괴롭','싫어 죽','사라지고','없어지고 싶','자해'];
    return k.some(function(w){ return text.indexOf(w)>-1; });
  }
};

/* ---------- Loop controller ---------- */
function loopDone(){ return DB.day().done; }
function nextStage(){ const done=loopDone(); for(const s of STAGES){ if(!done[s.key]) return s.key; } return null; }
function go(scKey){
  document.querySelectorAll('.sc').forEach(function(el){ el.classList.remove('on'); });
  const el = document.getElementById('sc-'+scKey); if(el){ el.classList.add('on'); window.scrollTo(0,0); }
}
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove('show'); },1800); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ---------- UI: 홈 (오늘의 루프) ---------- */
function renderHome(){
  const done = loopDone();
  const doneCount = STAGES.filter(function(s){ return done[s.key]; }).length;
  const active = DB.activeDays().length;
  const gs = growthStage(active);
  const idx = DB.day().stateIndex;
  const next = nextStage();

  let stages = STAGES.map(function(s, i){
    const isDone = !!done[s.key];
    const locked = !isDone && i>0 && !done[STAGES[i-1].key]; // 순서는 '제안'(이전 단계 권장) — 강제는 아님(눌러서 이동 가능)
    return '<div class="stage'+(isDone?' done':'')+'" onclick="enterStage(\''+s.key+'\')">'
      + '<div class="dot" style="background:'+s.color+'"><span class="han">'+s.han+'</span></div>'
      + '<div class="meta"><b>'+s.name+(s.key==='brain'?' <span style="font-size:10px;background:#FFF6DE;border:1px solid #F2C94C;color:#8A6D1A;border-radius:999px;padding:2px 7px;vertical-align:middle;white-space:nowrap">🌞 아침 추천</span>':'')+'</b><span>'+s.desc+'</span></div>'
      + (isDone?'<div class="chk">완료 ✓</div>':'<div class="chk" style="color:var(--muted)">→</div>')
      + '</div>';
  }).join('');

  const _pp=DB.profile(); const who=_pp?vocative(_pp.name):'';
  const tn=tone();
  const greeting = doneCount===0 ? greet0(who,tn)
    : doneCount<STAGES.length ? (tn==='teen'?'좋아, 이어서 가보자':'좋아요, 이어서 한 걸음 더')
    : (tn==='teen'?'오늘 루프 완료 — 꾸준함이 실력이야':'오늘도 한 뼘 자랐어요 🌱');
  const wk = DB.last7().map(function(w){ return '<div class="wd'+(w.today?' today':'')+'"><div class="c'+(w.level===2?' l2':w.level===1?' l1':'')+'">'+(w.level===2?'✓':'')+'</div>'+(w.today?'오늘':w.label)+'</div>'; }).join('');

  document.getElementById('sc-home').innerHTML =
    '<div class="loop-hero">'
    + '<p>오늘의 성장 루프</p>'
    + '<h1>'+greeting+'</h1>'
    + '<div class="streak">'+gs.emoji+' '+gs.name+' 단계 · 함께한 날 '+active+'일'+(DB.returnedAfterBreak()?' · 돌아와줘서 반가워요':'')+'</div>'
    + '</div>'
    + '<div class="week">'+wk+'</div>'
    + (idx!=null ? '<div class="card" style="margin-bottom:14px"><div style="font-size:12px;color:var(--muted)">오늘의 상태 지수</div><div style="font-size:30px;font-weight:700;color:var(--navy)">'+idx+'<span style="font-size:14px;color:var(--muted)"> / 100</span></div></div>' : '')
    + (DB.currentDream()? '<div class="hint" style="text-align:center;margin:-4px 0 8px">🌟 나의 꿈 — '+esc(DB.currentDream())+'</div>' : '')
    + '<div class="loop">'+stages+'</div>'
    + '<div class="hint" style="margin-top:10px;text-align:center">아침엔 <b class="han">腦</b>로 하루의 문을, 방과 후엔 <b class="han">心智動</b>으로 하루를 닫아요 · 한 번에 돌아도 좋아요</div>'
    + (next ? (function(){
        const h=new Date().getHours();
        const nmS=STAGES.find(function(s){return s.key===next;}).name;
        let lb;
        if(doneCount===0){ lb=(h>=5&&h<12)?'🌞 학교 가기 전 1분 — 오늘의 상태 보기':(h>=17?'🌙 하루 마무리 한 바퀴':'오늘의 루프 시작'); }
        else { lb=(h>=17?'🌙 하루 마무리: ':'다음: ')+nmS; }

function weekStats(){ return periodStats(7); }

function periodStats(n){
  const d=DB.load(); let act=0, full=0; const t=Date.now();
  for(let i=0;i<n;i++){ const k=DB.localDate(new Date(t-i*864e5)); const day=d.days[k]; const c=day?Object.keys(day.done||{}).length:0; if(c>0)act++; if(c>=4)full++; }
  const g=(d.gratitudes||[]).filter(function(x){ return (Date.now()-(x.at||0)) < n*864e5; }).length;
  const r=(d.reading||[]).filter(function(x){ return (Date.now()-(x.at||0)) < n*864e5; }).length;
  const idxs=DB.recentStateIndices(n);
  let idxAvg=null, idxTrend='';
  if(idxs.length){ idxAvg=Math.round(idxs.reduce(function(a,b){return a+b.idx;},0)/idxs.length);
    if(idxs.length>=6){ const h=Math.floor(idxs.length/2); const avg=function(z){return z.reduce(function(x,y){return x+y.idx;},0)/z.length;}; const diff=avg(idxs.slice(h))-avg(idxs.slice(0,h)); idxTrend=diff>=5?'오르는 중':diff<=-5?'내려가는 중':'안정적'; } }
  return { act:act, full:full, g:g, r:r, idxAvg:idxAvg, idxTrend:idxTrend };
}
function profileSummary(){
  const d=DB.load();
  const grats=(d.gratitudes||[]).slice(-9).map(function(g){return g.text;});
  const reads=(d.reading||[]).slice(-5).map(function(r){return r.title||'';}).filter(Boolean);

}

/* ---------- 성장 단계: 씨앗 → 새싹 → 어린나무 → 나무 (자기주도 성장 가시화) ---------- */
function growthStage(ad){
  if(ad>=365){
    const rings=Math.floor(ad/365);
    const allMax = fruits().every(function(f){ return f.lv>=f.t.length; });
    if(allMax) return {emoji:'🌳🌲🌳',name:'숲을 이루는 나무 · 나이테 '+rings+'개'};
    return {emoji:'🌲',name:'큰 나무 · 나이테 '+rings+'개'};
  }
  if(ad>=200) return {emoji:'🍎',name:'열매 맺은 나무'};
  if(ad>=120) return {emoji:'🌸',name:'꽃피는 나무'};
  if(ad>=66) return {emoji:'🌳',name:'나무'};
  if(ad>=30) return {emoji:'🌿',name:'어린나무'};
  if(ad>=7)  return {emoji:'🌱',name:'새싹'};
  return {emoji:'🌰',name:'씨앗'};
}
/* 다음 단계까지의 진행률(진행 바용) */
function stageProgress(ad){
  const L=[[7,'🌱 새싹'],[30,'🌿 어린나무'],[66,'🌳 나무'],[120,'🌸 꽃피는 나무'],[200,'🍎 열매 맺은 나무'],[365,'🌲 큰 나무']];
  for(let i=0;i<L.length;i++){ if(ad<L[i][0]){ const prev=i>0?L[i-1][0]:0; return {label:L[i][1], next:L[i][0], pct:Math.max(0,Math.min(100,Math.round((ad-prev)/(L[i][0]-prev)*100)))}; } }
  const rings=Math.floor(ad/365); const next=(rings+1)*365;
  return {label:'나이테 '+(rings+1)+'개', next:next, pct:Math.max(0,Math.min(100,Math.round((ad-rings*365)/365*100)))};
}
/* 열매: 腦心智動 네 갈래의 누적 성취(시간이 아니라 행위로 자라는 장기 동기) */
function fruits(){
  const d=DB.load();
  const meas=Object.keys(d.days).filter(function(k){return d.days[k].stateIndex!=null;}).length;
  const g=(d.gratitudes||[]).length;
  const r=(d.reading||[]).length;
  let acts=0, ret=0;
  Object.keys(d.days).forEach(function(k){ if(d.days[k].done&&d.days[k].done.action) acts++; });
  const days=DB.activeDays().sort();
  for(let i=1;i<days.length;i++){ if(Date.parse(days[i])-Date.parse(days[i-1])>2*864e5) ret++; }
  const lv=function(n,t){ let c=0; for(const x of t){ if(n>=x) c++; } return c; };
  // 心·智는 '핵심 가지'(열매 5단): 꾸준할수록 본인·부모·주변까지 변화가 보이는 영역이라 더 촘촘히 보상
  const tB=[10,30,100], tH=[30,100,300,600,1000], tW=[5,15,40,80,150], tA=[10,30,100];
  return [
    {han:'腦',label:'상태 살핀 날',n:meas,t:tB,lv:lv(meas,tB)},
    {han:'心',label:'감사',n:g,t:tH,lv:lv(g,tH),core:true},
    {han:'智',label:'읽기',n:r,t:tW,lv:lv(r,tW),core:true},
    {han:'動',label:'실천+복귀',n:acts+ret,t:tA,lv:lv(acts+ret,tA)}
  ];
}

  if(document.querySelector('.ovl')) return;
  const m=DB.readingMeters(); if(m<=0) return;
  const d=DB.load(); const last=d.runCel||0;
  const marks=[[5000,'5km 지점 통과'],[10000,'10km 지점 통과'],[21097.5,'하프 마라톤 통과'],[30000,'30km 지점 통과'],[42195,'마라톤 완주']];
  const lapMax=Math.floor(m/42195);
  let best=null;
  for(let L=0;L<=lapMax;L++){
    for(let i=0;i<marks.length;i++){
      const th=L*42195+marks[i][0];
      if(th<=m && th>last) best=[th, marks[i][1], L+1, marks[i][0]===42195];
    }
  }
  if(!best) return;
  d.runCel=best[0]; DB.save(d);
  const p=DB.profile(); const nm=p?vocative(p.name):'';
  const laps=Math.floor(m/42195);
  showOverlay('<div style="font-size:40px;margin-bottom:6px">'+(best[3]?'🏅':'🏃')+'</div><h2>'+(nm?nm+', ':'')+best[2]+'번째 마라톤 '+best[1]+'!</h2><p>'+(best[3]?('책 읽기로 42.195km를 완주했어! 완주 '+laps+'회 — 이 기록은 평생 남아.'):'1쪽 = 5m. 네가 읽은 만큼 달린 거야. 계속 가보자!')+'</p><button class="btn btn-primary" style="width:100%;margin-top:12px" onclick="this.closest(\'.ovl\').remove()">달리자!</button>');
  logEvent('run_mark',{m:Math.round(best[0])});
}

/* ---------- 호흡 가이드: 이완 훈련 (연령별 호흡 길이) ---------- */
function breathe(){
  const tn=tone();
  const phases = tn==='teen'
    ? [['코로 들이마시기',4,'scale(1.28)','배가 부풀어요'],['숨 멈추기',7,'scale(1.28)','그대로…'],['입으로 천천히 내쉬기',8,'scale(0.86)','끝까지, 천천히']]
    : [['들이마시기 — 배를 풍선처럼',4,'scale(1.28)','배가 풍선처럼 🎈'],['살짝 멈추기',4,'scale(1.28)','그대로…'],['후— 천천히 내쉬기',6,'scale(0.86)','풍선 바람 빼듯']];
  const rounds=3;
  const o=showOverlay(
    '<h2 id="br-t">함께 호흡해요</h2>'
    +'<div id="br-c" style="width:112px;height:112px;border-radius:50%;background:var(--mint-soft);border:3px solid var(--mint);margin:18px auto;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;color:var(--navy);transition:transform 1s ease">·</div>'
    +'<p id="br-s">시작을 누르면 3번의 호흡을 함께해요</p>'
    +'<button class="btn btn-primary" style="width:100%;margin-top:12px" id="br-go">시작</button>'
    +'<button class="btn btn-ghost" style="width:100%;margin-top:8px" onclick="this.closest(\'.ovl\').remove()">그만하기</button>');
  const tEl=o.querySelector('#br-t'), c=o.querySelector('#br-c'), sub=o.querySelector('#br-s'), go=o.querySelector('#br-go');
  go.onclick=function(){
    go.style.display='none';
    let r=0,ph=0,s=phases[0][1];
    function done(){
      tEl.textContent='참 잘했어요 🌿'; c.textContent='✓'; c.style.transform='scale(1)';
      sub.textContent='마음이 한결 가벼워졌길.';
      const a=document.getElementById('act'); if(a) a.value=(tn==='teen'?'4·7·8 호흡 3회':'풍선 복식호흡 3회');
      logEvent('breathe',{});
      setTimeout(function(){ const ov=c.closest('.ovl'); if(ov) ov.remove(); },1600);
    }
    function tick(){
      if(!document.body.contains(c)) return;
      tEl.textContent=(r+1)+' / '+rounds+' · '+phases[ph][0];
      c.textContent=s; c.style.transform=phases[ph][2]; sub.textContent=phases[ph][3];
      s--;
      if(s<0){ ph++; if(ph>=phases.length){ ph=0; r++; if(r>=rounds){ done(); return; } } s=phases[ph][1]; }
      setTimeout(tick,1000);
    }
    tick();
  };
}

/* ---------- 지난날의 오늘: 1년 전(2년 전…) 같은 날의 나 ---------- */
function pastToday(){
  const d=DB.load(); const t=DB.today(); const mmdd=t.slice(5); const year=+t.slice(0,4);
  const out=[];
  for(let y=year-1; y>=year-12; y--){
    const key=y+'-'+mmdd;
    const grats=(d.gratitudes||[]).filter(function(g){return g.date===key;}).map(function(g){return g.text;});
    const reads=(d.reading||[]).filter(function(r){return r.date===key;});
    const day=d.days[key];
    if(grats.length||reads.length||(day&&Object.keys(day.done||{}).length)) out.push({y:y,grats:grats,reads:reads,idx:day?day.stateIndex:null});
  }
  return out;
}

/* ---------- 기록 백업·복원 (삭제 사고 대비 + 기기 이사) ---------- */
function exportData(){
  const raw=localStorage.getItem(DB._key());
  if(!raw){ toast('아직 저장된 기록이 없어요'); return; }
  const payload=JSON.stringify({app:'simjios', ver:1, exportedAt:new Date().toISOString(), data:JSON.parse(raw)});
  const d=DB.localDate().replace(/-/g,'');
  const blob=new Blob([payload],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='심지OS_백업_'+d+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },2000);
  toast('백업 파일을 저장했어요 💾');
  logEvent('backup_export',{});
}
function importData(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=function(){
    const f=inp.files&&inp.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=function(){
      try{
        const obj=JSON.parse(rd.result);
        if(!obj || obj.app!=='simjios' || !obj.data){ alert('심지OS 백업 파일이 아니에요.'); return; }
        const when=(obj.exportedAt||'').slice(0,10);
        if(confirm('이 백업'+(when?'('+when+' 저장)':'')+'으로 기록을 복원할까요?\n지금 기기의 기록은 백업 내용으로 바뀝니다.')){
          localStorage.setItem(DB._key(), JSON.stringify(obj.data));
          location.reload();
        }
      }catch(e){ alert('파일을 읽지 못했어요. 백업 파일이 맞는지 확인해 주세요.'); }
    };
    rd.readAsText(f);
  };
  inp.click();
}

/* ---------- AI 응답 청소·검증 (형식 이탈 방어) ---------- */
function sanitizeAI(t){
  if(!t) return '';
  t=String(t);
  t=t.replace(/```[\s\S]*?```/g,' ');
  t=t.replace(/[\*#_`~>]+/g,'');
  t=t.replace(/[\[\]{}<>]/g,'');
  t=t.replace(/^\s*(json|output|response|응답|답변|아이|부모)\s*[:：]/i,'');
  t=t.replace(/\s+/g,' ').trim();
  return t;
}
function aiKoreanOk(t){
  if(!t) return false;
  const ko=(t.match(/[가-힣]/g)||[]).length;
  if(ko<4) return false;
  if(/Mind|Feeling|Parent|Child|Response|System/i.test(t)) return false;
  if(t.length>220) return false;
  return true;
}
