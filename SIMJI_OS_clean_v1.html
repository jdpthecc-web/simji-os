<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>심지OS · 오늘의 리듬</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1B2A4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="심지OS">
<link rel="apple-touch-icon" href="/simji-icon-180.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
.mic{border:1.5px solid var(--line);background:#fff;border-radius:12px;min-width:46px;font-size:18px;cursor:pointer;flex-shrink:0;font-family:inherit}
.mic:active{background:var(--mint-soft)}
body,h1,h2,h3,p,div,button,li{word-break:keep-all}
:root{
  --navy:#1A2E4A; --teal:#0F766E; --mint:#9FE1CB; --mint-soft:#E1F5EE;
  --ink:#13202F; --muted:#64748B; --line:#E2E8F0; --bg:#F7FAF9; --card:#FFFFFF;
  --brain:#378ADD; --heart:#D4537E; --wisdom:#BA7517; --action:#639922;
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'IBM Plex Sans KR',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.wrap{max-width:440px;margin:0 auto;min-height:100vh;background:var(--bg);padding:0 16px 96px}
.serif{font-family:'Gowun Batang',serif}
.han{font-family:'Gowun Batang',serif;font-weight:700}
.topbar{padding:18px 4px 8px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:15px;font-weight:700;color:var(--navy);letter-spacing:.2px}
.brand small{color:var(--teal);font-weight:500}
.sub{color:var(--muted);font-size:13px}
.sc{display:none;animation:fade .25s ease}
.sc.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:15px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
.btn-primary{background:var(--navy);color:#fff}
.btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--navy)}
.btn:active{transform:scale(.99)}
/* 오늘의 루프 헤더 카드 */
.loop-hero{background:linear-gradient(135deg,var(--navy),var(--teal));border-radius:20px;padding:22px;color:#fff;margin-bottom:14px}
.loop-hero h1{font-size:20px;margin:0 0 2px;font-weight:700}
.loop-hero p{margin:0;color:var(--mint);font-size:13px}
.streak{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;margin-top:14px}
/* 루프 단계 행 */
.loop{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.stage{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;transition:border-color .15s}
.stage:active{border-color:var(--teal)}
.stage .dot{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;flex-shrink:0}
.stage .meta{flex:1;min-width:0}
.stage .meta b{display:block;font-size:15px;color:var(--ink)}
.stage .meta span{font-size:12px;color:var(--muted)}
.stage .chk{font-size:13px;font-weight:700;color:var(--teal)}
.stage.done{opacity:.7}
.stage.locked{opacity:.5;cursor:default}
/* 단계 화면 공통 */
.stage-head{display:flex;align-items:center;gap:12px;margin:8px 0 16px}
.stage-head .badge{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff}
.stage-head h2{margin:0;font-size:19px}
.stage-head .sub{margin:0}
.q{font-size:16px;font-weight:500;margin:18px 0 12px}
.scale{display:flex;gap:8px}
.scale button{flex:1;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px 0;font-size:22px;cursor:pointer;font-family:inherit}
.scale button.sel{border-color:var(--teal);background:var(--mint-soft)}
.coach{background:var(--mint-soft);border:1px solid var(--mint);border-radius:14px;padding:16px;margin-top:8px}
.coach .label{font-size:11px;font-weight:700;color:var(--teal);margin-bottom:6px}
.coach .interp{font-size:15px;color:var(--ink);margin-bottom:10px}
.coach .step{font-size:14px;color:var(--ink);background:#fff;border-radius:10px;padding:12px;border:1px solid var(--mint)}
.hint{font-size:12px;color:var(--muted);margin-top:10px;text-align:center}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;z-index:50;white-space:nowrap}
.toast.show{opacity:1}
textarea,input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-family:inherit;font-size:14px;resize:none}
textarea:focus,input:focus{outline:none;border-color:var(--teal)}
.marathon{background:linear-gradient(135deg,#7c4a03,#BA7517);color:#fff;border-radius:14px;padding:16px;margin-bottom:12px;line-height:1.4}
.marathon b{font-size:24px}
.rlog{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.rlog b{font-size:14px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rlog span{font-size:11px;color:var(--muted);flex-shrink:0;margin-left:10px}
.nonmed{font-size:11px;color:var(--muted);text-align:center;margin-top:18px;line-height:1.5}
/* ---- 디테일: 오버레이 / 주간 도장 / 실천 칩 / 축하 ---- */
.ovl{position:fixed;inset:0;background:rgba(19,28,40,.55);display:flex;align-items:center;justify-content:center;z-index:90;padding:24px}
.ovl-card{background:#fff;border-radius:22px;padding:28px 22px;max-width:360px;width:100%;text-align:center;position:relative;overflow:hidden}
.ovl-card h2{font-family:'Gowun Batang',serif;color:var(--navy);font-size:22px;margin-bottom:10px}
.ovl-card p{font-size:14px;color:var(--muted);line-height:1.7}
.ovl-card input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:16px;text-align:center;margin:14px 0;font-family:inherit}
.week{display:flex;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:14px}
.wd{text-align:center;font-size:10px;color:var(--muted)}
.wd .c{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;margin:0 auto 4px;font-size:12px;color:#fff}
.wd .c.l1{background:var(--mint);border-color:var(--mint)}
.wd .c.l2{background:var(--teal);border-color:var(--teal)}
.wd.today{color:var(--teal);font-weight:700}
.wd.today .c{border:2.5px solid var(--teal);box-shadow:0 0 0 3px var(--mint-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer;font-family:inherit}
.chip:active{background:var(--mint-soft);border-color:var(--mint)}
.chip.sel{background:var(--mint-soft);border-color:var(--mint);font-weight:700;color:var(--navy)}
.chip-do{border-color:var(--teal);color:var(--teal);font-weight:600}
.chip-breathe{border:1.5px solid var(--mint);background:var(--mint-soft);color:var(--navy);font-weight:700}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti span{position:absolute;top:100%;font-size:20px;animation:fly 1.6s ease-out forwards}
@keyframes fly{to{transform:translateY(-360px) rotate(360deg);opacity:0}}
.gear{cursor:pointer;font-size:16px;color:var(--muted);padding:4px 6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">심지OS <small>· 뇌심지동</small></div>
    <div style="display:flex;align-items:center;gap:4px">
      <div class="sub" id="child-label" onclick="openChildSwitch()" style="cursor:pointer;border:1px solid var(--mint);color:var(--teal);border-radius:999px;padding:3px 12px;display:none"></div>
      <div class="sub" id="role-label" onclick="toggleRole()" style="cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:3px 12px">학생 ▾</div>
      <div class="gear" onclick="openSettings()">⚙</div>
    </div>
  </div>

  <!-- 홈: 오늘의 루프 -->
  <div id="sc-home" class="sc on"></div>

  <!-- 腦 상태 -->
  <div id="sc-brain" class="sc"></div>

  <!-- 心 관계·마음 -->
  <div id="sc-heart" class="sc"></div>

  <!-- 智 의미·질문 -->
  <div id="sc-wisdom" class="sc"></div>

  <!-- 動 실천·복귀 -->
  <div id="sc-action" class="sc"></div>

  <!-- 부모 창 -->
  <div id="sc-parent" class="sc"></div>

  <!-- 나의 방 -->
  <div id="sc-myroom" class="sc"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   심지OS — 클린 빌드 v1 (오늘의 루프 골격 + 腦 상태 코치)
   구조: Config → Storage → StateIndex → AIClient → Guardrails → Loop → UI → Init
   ※ 인젝트 덧대기 없음. 각 영역이 한 곳에 모여 있어 수정이 쉽다.
   ========================================================================= */

/* ---------- Config ---------- */
const STAGES = [
  { key:'brain',  han:'腦', name:'상태',      desc:'오늘 배움의 문이 열렸나', color:'var(--brain)',  emoji:'🧠' },
  { key:'heart',  han:'心', name:'관계·마음', desc:'안전하게 마음을 나눈다',  color:'var(--heart)',  emoji:'💗' },
  { key:'wisdom', han:'智', name:'의미·질문', desc:'내 말로 다시, 질문하기',  color:'var(--wisdom)', emoji:'📖' },
  { key:'action', han:'動', name:'실천·복귀', desc:'작게 하나, 다시 돌아오기', color:'var(--action)', emoji:'🌱' },
];
const AI_ENDPOINT = '/ai';        // 서버 프록시(Gemini/Vertex) → 없으면 폴백
const METRICS_ENDPOINT = '/metrics/event';

/* ---------- 자녀 프로필 관리 (형제자매 저장소 분리) ----------
   설계 원칙: 기존 사용자의 데이터는 절대 옮기지 않는다.
   기존 키('simji_clean_v1')를 첫째의 키로 그대로 쓰고, 둘째부터 새 키를 부여한다. */
const CHILDREN_KEY='simji_children', ACTIVE_KEY='simji_active_child', LEGACY_KEY='simji_clean_v1';
function getChildren(){ try{ return JSON.parse(localStorage.getItem(CHILDREN_KEY))||[]; }catch(e){ return []; } }
function saveChildren(list){ try{ localStorage.setItem(CHILDREN_KEY, JSON.stringify(list)); }catch(e){} }
function activeChildId(){ try{ return localStorage.getItem(ACTIVE_KEY)||''; }catch(e){ return ''; } }
function setActiveChild(id){ try{ localStorage.setItem(ACTIVE_KEY, id); }catch(e){} }
function activeChild(){
  const l=getChildren(); if(!l.length) return null;
  const id=activeChildId();
  return l.filter(function(c){return c.id===id;})[0] || l[0];
}
// 최초 실행 시: 기존 데이터가 있으면 첫째로 편입 (데이터 이동 없음)
function ensureChildren(){
  let l=getChildren();
  if(l.length){ if(!activeChildId()) setActiveChild(l[0].id); return l; }
  let raw=null; try{ raw=localStorage.getItem(LEGACY_KEY); }catch(e){}
  if(raw){
    let nm='첫째';
    try{ const d=JSON.parse(raw); if(d&&d.profile&&d.profile.name) nm=d.profile.name; }catch(e){}
    l=[{id:'first', name:nm, key:LEGACY_KEY}];
    saveChildren(l); setActiveChild('first');
  }
  return l;
}
// 온보딩·이름변경 후 자녀 목록과 동기화
function syncChildFromProfile(){
  const p=DB.profile(); if(!p||!p.name) return;
  let l=getChildren();
  if(!l.length){ l=[{id:'first', name:p.name, key:LEGACY_KEY}]; saveChildren(l); setActiveChild('first'); }
  else{
    const id=activeChildId()||l[0].id;
    l=l.map(function(c){ return c.id===id ? Object.assign({},c,{name:p.name}) : c; });
    saveChildren(l);
  }
  renderChildLabel();
}
function addChild(name){
  const l=getChildren();
  const id='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  l.push({id:id, name:(name||'').trim()||'새 아이', key:LEGACY_KEY+'__'+id});
  saveChildren(l); setActiveChild(id);
}
function renderChildLabel(){
  const el=document.getElementById('child-label'); if(!el) return;
  const l=getChildren();
  if(l.length<2){ el.style.display='none'; return; }
  const c=activeChild();
  el.style.display=''; el.textContent='👦 '+((c&&c.name)||'아이')+' ▾';
}
function openChildSwitch(){
  const l=getChildren(); const cur=activeChildId();
  const rows=l.map(function(c){
    const on=(c.id===cur);
    return '<div onclick="switchChild(\''+c.id+'\')" style="cursor:pointer;padding:14px 12px;border-radius:12px;margin-bottom:8px;border:1px solid '+(on?'var(--mint)':'var(--line)')+';background:'+(on?'var(--mint-soft)':'#fff')+'">'
      + '<b>'+esc(c.name)+'</b>'+(on?' <span style="color:var(--teal);font-size:12px">· 지금 사용 중</span>':'')+'</div>';
  }).join('');
  showOverlay(
    '<div style="font-size:30px;margin-bottom:4px">👨‍👩‍👧‍👦</div>'
    + '<h2>어떤 아이인가요?</h2>'
    + '<p style="font-size:13px;color:var(--muted);margin-bottom:12px">아이마다 기록이 따로 쌓여요. 형제가 같은 기기를 쓴다면 꼭 바꿔 주세요.</p>'
    + rows
    + '<input type="text" id="newChildName" placeholder="새로 추가할 아이 이름" style="margin-top:6px">'
    + '<button class="btn btn-ghost" onclick="doAddChild()">+ 아이 추가하기</button>'
    + '<button class="btn btn-primary" style="margin-top:8px" onclick="this.closest(\'.ovl\').remove()">닫기</button>'
  );
}
function switchChild(id){
  setActiveChild(id);
  const o=document.querySelector('.ovl'); if(o) o.remove();
  renderChildLabel();
  ROLE='student';
  const rl=document.getElementById('role-label'); if(rl) rl.textContent='학생 ▾';
  goHome(); maybeOnboard();
}
function doAddChild(){
  const el=document.getElementById('newChildName');
  const nm=(el&&el.value||'').trim();
  if(!nm){ toast('아이 이름을 적어주세요'); return; }
  addChild(nm);
  const o=document.querySelector('.ovl'); if(o) o.remove();
  renderChildLabel();
  ROLE='student';
  const rl=document.getElementById('role-label'); if(rl) rl.textContent='학생 ▾';
  goHome(); maybeOnboard();
}

/* ---------- 쉬었던 이유 묻기 (이탈 원인 수집) ----------
   원칙: 아이에게는 묻지 않는다(자책감). 부모 창에서만, 오래 쉬었을 때 1회. */
function daysSinceLastActive(){
  const days=DB.activeDays().sort();
  if(!days.length) return 0;
  const last=new Date(days[days.length-1]+'T00:00:00').getTime();
  return Math.floor((Date.now()-last)/864e5);
}
function gapAskHtml(){
  // 마지막 활동이 7일 이상 전이고, 아직 답하지 않았을 때만
  const gap=daysSinceLastActive();
  if(gap<7) return '';
  let asked=null; try{ asked=localStorage.getItem('simji_gap_asked'); }catch(e){}
  const tag=DB.today().slice(0,7); // 한 달에 한 번까지만
  if(asked===tag) return '';
  return '<div class="card" id="gap-box" style="margin-bottom:14px;border:1px dashed var(--line)">'
    + '<div style="font-weight:700;margin-bottom:4px">🌱 '+childNameOr('아이')+'가 '+gap+'일째 쉬고 있어요</div>'
    + '<div style="font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:10px">괜찮습니다. 좋은 습관은 하루아침에 만들어지지 않으니까요.<br>다만 <b>무엇이 걸림돌이었는지</b> 한 가지만 알려주시면, 그 부분을 고치겠습니다.</div>'
    + gapBtn('busy','바빠서 챙겨주지 못했어요')
    + gapBtn('forget','아이도 저도 잊어버렸어요')
    + gapBtn('hard','아이가 문장 쓰기를 어려워해요')
    + gapBtn('boring','아이가 재미없어해요')
    + gapBtn('device','기기를 쓰기 불편했어요')
    + gapBtn('other','다른 이유예요')
    + '<div style="font-size:11px;color:var(--muted);text-align:center;margin-top:4px;cursor:pointer" onclick="closeGapAsk()">나중에 답할게요</div>'
    + '</div>';
}
function childNameOr(fallback){
  try{ const p=DB.profile(); return (p&&p.name)?p.name:fallback; }catch(e){ return fallback; }
}
function gapBtn(code,label){
  return '<div onclick="sendGap(\''+code+'\')" style="cursor:pointer;font-size:13px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px">'+label+'</div>';
}
function sendGap(code){
  const gap=daysSinceLastActive();
  try{ logEvent('gap_reason', { reason:code, gapDays:gap }); }catch(e){}
  try{ localStorage.setItem('simji_gap_asked', DB.today().slice(0,7)); }catch(e){}
  const box=document.getElementById('gap-box');
  if(box) box.innerHTML='<div style="font-size:13px;color:var(--teal);padding:12px 0;text-align:center">알려주셔서 고맙습니다 💛<br>오늘 다시 시작하면 그걸로 충분해요.</div>';
}
function closeGapAsk(){
  try{ localStorage.setItem('simji_gap_asked', DB.today().slice(0,7)); }catch(e){}
  const box=document.getElementById('gap-box'); if(box) box.remove();
}

/* ---------- 나의 문장 모음 (평생 아카이브) ---------- */
function renderSentences(){
  const d=DB.load(); const p=DB.profile(); const nm=p?p.name:'나';
  const reads=(d.reading||[]).filter(function(e){ return e.recon && e.recon.trim(); });
  const total=reads.length;
  // 연도별로 묶기 (최신순)
  const byYear={};
  reads.slice().reverse().forEach(function(e){
    const y=(e.date||'').slice(0,4)||'기타';
    if(!byYear[y]) byYear[y]=[];
    byYear[y].push(e);
  });
  const years=Object.keys(byYear).sort().reverse();
  let body='';
  if(!total){
    body='<div class="card"><div style="font-size:14px;color:var(--muted);padding:10px 0;text-align:center">아직 모은 문장이 없어요.<br>오늘 읽은 책에서 마음에 남은 한 줄을 적어볼까? 🌱</div></div>';
  } else {
    years.forEach(function(y){
      const items=byYear[y];
      body += '<div style="font-weight:700;color:var(--teal);margin:16px 2px 8px">'+y+'년 · 문장 '+items.length+'개</div>';
      body += items.map(function(e){
        return '<div class="card" style="margin-bottom:8px;padding:14px">'
          + '<div style="font-size:15px;line-height:1.75;color:var(--ink)">“'+esc(e.recon.trim())+'”</div>'
          + '<div style="font-size:11px;color:var(--muted);margin-top:8px">'+esc(e.date||'')+(e.title?' · '+esc(e.title):'')+'</div>'
          + (e.answer?'<div style="font-size:12px;color:var(--teal);margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)">💭 '+esc(e.answer)+'</div>':'')
          + '</div>';
      }).join('');
    });
  }
  document.getElementById('sc-myroom').innerHTML =
    '<div class="loop-hero" style="background:linear-gradient(135deg,#1B6F5B,#2F9E83)"><p>평생 남는 기록</p><h1>'+esc(nm)+'의 문장 모음</h1>'

/* ---------- StateIndex (투명한 규칙 기반) ----------
   AI가 숫자를 즉흥 생성하지 않는다. 지수는 입력의 가중합(설명 가능).
   입력원: 기본=자기보고(집중/컨디션). 추후 마이크로과제·HRV·EEG를 같은 자리에 끼움. */
function computeStateIndex(b){
  // 사용 가능한 신호만 가중 합산(설명 가능). 자기보고=항상, 반응속도/맥박=선택.
  const parts=[], weights=[];
  parts.push(((b.focus||3)/5*0.55 + (b.energy||3)/5*0.45)*100); weights.push(0.5);
  if(b.taskScore!=null){ parts.push(b.taskScore); weights.push(0.4); }
  const wsum=weights.reduce(function(a,c){return a+c;},0);
  let acc=0; for(let i=0;i<parts.length;i++){ acc+=parts[i]*weights[i]; }
  return Math.round(acc/wsum);
}

/* ---------- AIClient (서버 /ai 프록시; 실패 시 안전 템플릿 폴백) ---------- */
/* AI 호출 — 지시문(프롬프트)은 서버가 보관합니다.
   앱은 '무슨 작업인지'와 필요한 값만 보냅니다. */
async function aiTask(task, vars){
  try{
    const r = await fetch('/ai/task', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ task:task, vars:vars||{} })
    });
    if(!r.ok) return null;
    const d = await r.json();
    return d && d.text ? sanitizeAI(d.text) : null;
  }catch(e){ return null; }
}
function logEvent(type, payload){

}

function rtToScore(ms){ const sc=Math.round(95-(ms-250)*(60/450)); return Math.max(10,Math.min(100,sc)); }

const ACT_FN = {
  '목·어깨 스트레칭 1분':'doStretch',

function recentActs(n){
  try{
    const d=DB.load(); const seen={}; const out=[];
    Object.keys(d.days).sort().reverse().forEach(function(k){
      const a=d.days[k].done && d.days[k].done.action;
      const v=a && a.act && String(a.act).trim();
      if(v && !seen[v]){ seen[v]=1; out.push(v); }
    });
    return out.slice(0, n||3);
  }catch(e){ return []; }

function actStreak(){

var _actShown = [];   /* 이번 세션에 이미 제안한 것 — 연달아 같은 게 안 나오게 */
function pickFromPool(){
  const pool = ACT_POOL[tone()==='teen'?'teen':'elem'];
  const done = recentActs(6);
  let cand = pool.filter(function(x){ return _actShown.indexOf(x)<0 && done.indexOf(x)<0; });
  if(!cand.length) cand = pool.filter(function(x){ return _actShown.indexOf(x)<0; });
  if(!cand.length){ _actShown = []; cand = pool; }
  return cand[Math.floor(Math.random()*cand.length)];
}

async function suggestAct(btn){
  const tip=document.getElementById('act-tip'), tt=document.getElementById('act-tip-t');

  const theme=themes[Math.floor(Math.random()*themes.length)];
  let out=null;
  try{
    out = await aiTask('action_suggest', {
      name: p?p.name:'', band: p?p.band:'',
      focus: (typeof _brainInput!=='undefined')?_brainInput.focus:null,
      energy: (typeof _brainInput!=='undefined')?_brainInput.energy:null,
      recent: recentActs(3), avoid: _actShown.slice(-6), theme: theme
    });
  }catch(e){ out=null; }
  // AI가 실패했거나 방금 준 것과 같으면 후보 목록에서 새로 고른다
  if(!out || _actShown.indexOf(out)>=0) out = pickFromPool();
  const text = out;
  _actShown.push(text); if(_actShown.length>12) _actShown.shift();
  const inp=document.getElementById('act'); if(inp) inp.value=text;
  const all=document.querySelectorAll('[data-act]'); for(let i=0;i<all.length;i++) all[i].classList.remove('sel');

}

    +'<button class="btn btn-ghost" style="width:100%;margin-top:8px" onclick="closeOvl(this)">그만하기</button>');
  const tEl=o.querySelector('#sq-t'), c=o.querySelector('#sq-c'), sub=o.querySelector('#sq-s');
  const go=o.querySelector('#sq-go'), manual=o.querySelector('#sq-manual');
  let n=0, timer=null;

  function show(){ c.innerHTML=n+' <span style="font-size:20px;color:var(--muted)">/ 10</span>'; }
  function finish(){
    if(timer) clearTimeout(timer);
    c.innerHTML='✓'; tEl.textContent='다 했어요! 💪'; sub.textContent='열 번 완료. 몸이 조금 개운하죠?';
    speak('열 번 다 했어요. 참 잘했어요');
    fillAct(label); logEvent('run_mark',{kind:kind});
    setTimeout(function(){ closeOvl(c); },2200);
  }

  /* 자동 모드 — 일정한 박자로 세어주고 아이는 따라만 한다 */
  go.onclick=function(){
    go.style.display='none'; manual.style.display='none';
    let ready=3;
    sub.textContent='준비하세요';
    speak('준비하세요');
    (function countdown(){
      if(!document.body.contains(c)) return;
      if(ready>0){ c.innerHTML=ready; speak(String(ready)); ready--; timer=setTimeout(countdown,1000); return; }
      sub.textContent='소리에 맞춰 함께해요';
      speak('시작');
      timer=setTimeout(rep, 900);
    })();
    function rep(){
      if(!document.body.contains(c)) return;
      n++; show(); speak(names[n-1]);
      if(n===5) sub.textContent='절반! 잘하고 있어요 💪';
      if(n>=10){ setTimeout(finish,900); return; }
      timer=setTimeout(rep, msPerRep);
    }
  };

  /* 직접 세기 — 자기 속도로 하고 싶을 때 */
  manual.onclick=function(){
    go.style.display='none'; manual.style.display='none';
    sub.textContent='한 번 할 때마다 아래를 누르세요';
    const tap=document.createElement('button');

    tap.style.cssText='width:100%;margin-top:12px;padding:20px;font-size:18px';

    manual.parentNode.insertBefore(tap, manual);

    tap.onclick=function(){
      if(n>=10) return;
      n++; show(); speak(names[n-1]);
      if(n===5) sub.textContent='절반! 잘하고 있어요 💪';
      if(n>=10){ tap.style.display='none'; finish(); }
    };
  };
}

var VOICE_ON = localStorage.getItem('simji_voice') !== '0';

function speak(text){
  if(!VOICE_ON || !text || !voiceAvailable()) return;
  try{
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(String(text));
    u.lang='ko-KR'; u.rate=0.92; u.pitch=1.05; u.volume=1;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function sttAvailable(){ try{ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }catch(e){ return false; } }
var _stt=null;
function sttBtnHtml(targetId){
  if(!sttAvailable()) return '';
  return '<button type="button" class="chip" id="stt-'+targetId+'" style="margin-top:8px" onclick="toggleSTT(\''+targetId+'\',this)">🎤 말로 적기</button>'
       + '<div class="hint" style="text-align:left;margin-top:4px">말한 내용은 글자로만 바뀌어요. 목소리는 저장되지 않아요.</div>';
}
function toggleSTT(targetId, btn){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const ta = document.getElementById(targetId);
  if(!SR || !ta) return;
  if(_stt){ try{ _stt.stop(); }catch(e){} _stt=null; btn.textContent='🎤 말로 적기'; return; }
  stopSpeak();
  const r = new SR();
  r.lang='ko-KR'; r.interimResults=true; r.maxAlternatives=1; r.continuous=false;
  const base = (ta.value||'');
  btn.textContent='🔴 듣는 중… (누르면 멈춤)';
  r.onresult=function(e){
    let fin='', interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const tr=e.results[i][0].transcript;
      if(e.results[i].isFinal) fin+=tr; else interim+=tr;
    }
    ta.value = (base + fin + interim).slice(0,120);
  };
  r.onerror=function(ev){
    _stt=null; btn.textContent='🎤 말로 적기';
    if(ev && ev.error==='not-allowed') toast('마이크 사용을 허용해 주세요');
    else if(ev && ev.error==='no-speech') toast('소리가 잘 안 들렸어요. 다시 해볼까?');
  };
  r.onend=function(){ _stt=null; btn.textContent='🎤 말로 적기'; if(ta.value.trim()) toast('잘 적혔는지 확인해 보세요'); };
  try{ r.start(); _stt=r; }catch(e){ btn.textContent='🎤 말로 적기'; _stt=null; }
}

function trialInfo(){
  // 총 체험일수는 서버가 알려줌(기존 가입자 14일 / 신규 7일). 없으면 7일로 본다.
  var total=Math.max(1,parseInt(localStorage.getItem('simji_trial_total'),10)||7);
  var srv=localStorage.getItem('simji_trial_left');
  if(srv!=null){ var left=Math.max(0,parseInt(srv,10)||0); return { dayNum: total-left+1, left: left, total: total, ended: left<=0 }; }
  var k='simji_trial_start', s=localStorage.getItem(k);
  if(!s){ s=String(Date.now()); localStorage.setItem(k,s); }
  var days=Math.floor((Date.now()-parseInt(s,10))/86400000);
  return { dayNum: days+1, left: Math.max(0,total-days), total: total, ended: days>=total };
}

function weekStats(){ return periodStats(7); }

function periodStats(n){
  const d=DB.load(); let act=0, full=0; const t=Date.now();
  for(let i=0;i<n;i++){ const k=DB.localDate(new Date(t-i*864e5)); const day=d.days[k]; const c=day?Object.keys(day.done||{}).length:0; if(c>0)act++; if(c>=4)full++; }
  const g=(d.gratitudes||[]).filter(function(x){ return (Date.now()-(x.at||0)) < n*864e5; }).length;
  const r=(d.reading||[]).filter(function(x){ return (Date.now()-(x.at||0)) < n*864e5; }).length;
  const idxs=DB.recentStateIndices(n);
  let idxAvg=null, idxTrend='';
  if(idxs.length){ idxAvg=Math.round(idxs.reduce(function(a,b){return a+b.idx;},0)/idxs.length);
    if(idxs.length>=6){ const h=Math.floor(idxs.length/2); const avg=function(z){return z.reduce(function(x,y){return x+y.idx;},0)/z.length;}; const diff=avg(idxs.slice(h))-avg(idxs.slice(0,h)); idxTrend=diff>=5?'오르는 중':diff<=-5?'내려가는 중':'안정적'; } }
  return { act:act, full:full, g:g, r:r, idxAvg:idxAvg, idxTrend:idxTrend };
}
function profileSummary(){
  const d=DB.load();
  const grats=(d.gratitudes||[]).slice(-9).map(function(g){return g.text;});
  const reads=(d.reading||[]).slice(-5).map(function(r){return r.title||'';}).filter(Boolean);
  const acts=[]; Object.keys(d.days).sort().slice(-30).forEach(function(k){ const a=d.days[k].done&&d.days[k].done.action; if(a&&a.act) acts.push(a.act); });
  return { grats:grats, reads:reads, acts:acts.slice(-5), dream:DB.currentDream() };
}

/* ---------- 성장 단계: 씨앗 → 새싹 → 어린나무 → 나무 (자기주도 성장 가시화) ---------- */
function growthStage(ad){
  if(ad>=365){
    const rings=Math.floor(ad/365);
    const allMax = fruits().every(function(f){ return f.lv>=f.t.length; });
    if(allMax) return {emoji:'🌳🌲🌳',name:'숲을 이루는 나무 · 나이테 '+rings+'개'};
    return {emoji:'🌲',name:'큰 나무 · 나이테 '+rings+'개'};
  }
  if(ad>=200) return {emoji:'🍎',name:'열매 맺은 나무'};
  if(ad>=120) return {emoji:'🌸',name:'꽃피는 나무'};
  if(ad>=66) return {emoji:'🌳',name:'나무'};
  if(ad>=30) return {emoji:'🌿',name:'어린나무'};
  if(ad>=7)  return {emoji:'🌱',name:'새싹'};
  return {emoji:'🌰',name:'씨앗'};
}
/* 다음 단계까지의 진행률(진행 바용) */
function stageProgress(ad){
  const L=[[7,'🌱 새싹'],[30,'🌿 어린나무'],[66,'🌳 나무'],[120,'🌸 꽃피는 나무'],[200,'🍎 열매 맺은 나무'],[365,'🌲 큰 나무']];
  for(let i=0;i<L.length;i++){ if(ad<L[i][0]){ const prev=i>0?L[i-1][0]:0; return {label:L[i][1], next:L[i][0], pct:Math.max(0,Math.min(100,Math.round((ad-prev)/(L[i][0]-prev)*100)))}; } }
  const rings=Math.floor(ad/365); const next=(rings+1)*365;
  return {label:'나이테 '+(rings+1)+'개', next:next, pct:Math.max(0,Math.min(100,Math.round((ad-rings*365)/365*100)))};
}
/* 열매: 腦心智動 네 갈래의 누적 성취(시간이 아니라 행위로 자라는 장기 동기) */
function fruits(){
  const d=DB.load();
  const meas=Object.keys(d.days).filter(function(k){return d.days[k].stateIndex!=null;}).length;
  const g=(d.gratitudes||[]).length;
  const r=(d.reading||[]).length;
  let acts=0, ret=0;
  Object.keys(d.days).forEach(function(k){ if(d.days[k].done&&d.days[k].done.action) acts++; });
  const days=DB.activeDays().sort();
  for(let i=1;i<days.length;i++){ if(Date.parse(days[i])-Date.parse(days[i-1])>2*864e5) ret++; }
  const lv=function(n,t){ let c=0; for(const x of t){ if(n>=x) c++; } return c; };
  // 心·智는 '핵심 가지'(열매 5단): 꾸준할수록 본인·부모·주변까지 변화가 보이는 영역이라 더 촘촘히 보상
  const tB=[10,30,100], tH=[30,100,300,600,1000], tW=[5,15,40,80,150], tA=[10,30,100];
  return [
    {han:'腦',label:'상태 살핀 날',n:meas,t:tB,lv:lv(meas,tB)},
    {han:'心',label:'감사',n:g,t:tH,lv:lv(g,tH),core:true},
    {han:'智',label:'읽기',n:r,t:tW,lv:lv(r,tW),core:true},
    {han:'動',label:'실천+복귀',n:acts+ret,t:tA,lv:lv(acts+ret,tA)}
  ];
}
/* ---------- AI 변화 감지: 회복탄력성의 '행동 증거'를 사건 단위로 포착해 축하 ---------- */
function checkGrowthMoments(){
  if(document.querySelector('.ovl')) return;
  const d=DB.load(); if(!d.changes) d.changes={};
  const day=DB.day(); const doneCnt=Object.keys(day.done||{}).length;
  const idxs=DB.recentStateIndices(14);
  const moments=[];
  if(DB.returnedAfterBreak() && doneCnt>0 && !d.changes.firstReturn)
    moments.push(['firstReturn','🔄','다시 일어선 날','며칠 쉬었다가 스스로 돌아왔어 — 이게 바로 회복탄력성이야. 하루 빠져도 습관은 무너지지 않아.']);
  if(day.stateIndex!=null && day.stateIndex<50 && doneCnt>=4 && !d.changes.cloudyLoop)
    moments.push(['cloudyLoop','🌈','흐린 날에도 해내기','컨디션이 낮은 날에 끝까지 해내는 하루가 진짜 힘이야.']);
  if(idxs.length>=6 && !d.changes.uptrend){
    const h=Math.floor(idxs.length/2); const avg=function(z){return z.reduce(function(x,y){return x+y.idx;},0)/z.length;};
    if(avg(idxs.slice(h))-avg(idxs.slice(0,h))>=5)
      moments.push(['uptrend','📈','오르막이 시작됐어','최근 상태가 차츰 오르고 있어. 매일의 1분이 쌓인 거야.']);
  }
  if(DB.gratitudeCount()>=50 && !d.changes.grat50)
    moments.push(['grat50','🙏','감사 50개를 발견한 눈','감사를 50번 발견한 눈은 이미 세상이 다르게 보여.']);
  if(!moments.length) return;

/* ---------- 智 마라톤 구간 축하 (1쪽=5m · 완주 42.195km) ---------- */
function fmtDist(m){ return m<1000? Math.round(m)+'m' : (m/1000).toFixed(m<10000?2:1)+'km'; }
function checkRunMoments(){
  if(document.querySelector('.ovl')) return;
  const m=DB.readingMeters(); if(m<=0) return;
  const d=DB.load(); const last=d.runCel||0;
  const marks=[[5000,'5km 지점 통과'],[10000,'10km 지점 통과'],[21097.5,'하프 마라톤 통과'],[30000,'30km 지점 통과'],[42195,'마라톤 완주']];
  const lapMax=Math.floor(m/42195);
  let best=null;
  for(let L=0;L<=lapMax;L++){
    for(let i=0;i<marks.length;i++){
      const th=L*42195+marks[i][0];
      if(th<=m && th>last) best=[th, marks[i][1], L+1, marks[i][0]===42195];
    }
  }
  if(!best) return;
  d.runCel=best[0]; DB.save(d);
  const p=DB.profile(); const nm=p?vocative(p.name):'';
  const laps=Math.floor(m/42195);
  showOverlay('<div style="font-size:40px;margin-bottom:6px">'+(best[3]?'🏅':'🏃')+'</div><h2>'+(nm?nm+', ':'')+best[2]+'번째 마라톤 '+best[1]+'!</h2><p>'+(best[3]?('책 읽기로 42.195km를 완주했어! 완주 '+laps+'회 — 이 기록은 평생 남아.'):'1쪽 = 5m. 네가 읽은 만큼 달린 거야. 계속 가보자!')+'</p><button class="btn btn-primary" style="width:100%;margin-top:12px" onclick="this.closest(\'.ovl\').remove()">달리자!</button>');
  logEvent('run_mark',{m:Math.round(best[0])});
}

/* ---------- 호흡 가이드: 이완 훈련 (연령별 호흡 길이) ---------- */
function breathe(){
  const tn=tone();
  /* 4초 들이쉬고 6초 내쉬기 = 분당 6회.
     느린 호흡(분당 약 6회)과 들숨보다 긴 날숨이 이완 반응 연구에서 가장 근거가 탄탄한 조합입니다. */
  const phases = tn==='teen'
    ? [['코로 들이마시기',4,'scale(1.28)','배가 부풀어요','들이마시고'],['입으로 천천히 내쉬기',6,'scale(0.86)','끝까지, 천천히','천천히 내쉬고']]
    : [['들이마시기 — 배를 풍선처럼',4,'scale(1.28)','배가 풍선처럼 🎈','들이마시고'],['후— 천천히 내쉬기',6,'scale(0.86)','풍선 바람 빼듯','천천히 내쉬고']];
  const rounds=5;
  const o=showOverlay(
    '<h2 id="br-t">함께 호흡해요</h2>'
    +'<div id="br-c" style="width:112px;height:112px;border-radius:50%;background:var(--mint-soft);border:3px solid var(--mint);margin:18px auto;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;color:var(--navy);transition:transform 1s ease">·</div>'
    +'<p id="br-s">시작을 누르면 5번의 호흡을 함께해요 (약 50초)</p>'
    +'<p style="font-size:12px;color:var(--muted);margin-top:6px">어지러우면 멈추고 편하게 숨쉬세요.</p>'
    +voiceBtnHtml()
    +'<button class="btn btn-primary" style="width:100%;margin-top:12px" id="br-go">시작</button>'
    +'<button class="btn btn-ghost" style="width:100%;margin-top:8px" onclick="this.closest(\'.ovl\').remove()">그만하기</button>');
  const tEl=o.querySelector('#br-t'), c=o.querySelector('#br-c'), sub=o.querySelector('#br-s'), go=o.querySelector('#br-go');
  go.onclick=function(){
    go.style.display='none';
    let r=0,ph=0,s=phases[0][1];
    function done(){
      tEl.textContent='참 잘했어요 🌿'; c.textContent='✓'; c.style.transform='scale(1)';
      sub.textContent='마음이 한결 가벼워졌길.';
      speak('참 잘했어요');
      fillAct('느린 호흡 5회');
      logEvent('breathe',{});
      setTimeout(function(){ const ov=c.closest('.ovl'); if(ov) ov.remove(); },1600);
    }
    function tick(){
      if(!document.body.contains(c)) return;
      tEl.textContent=(r+1)+' / '+rounds+' · '+phases[ph][0];
      c.textContent=s; c.style.transform=phases[ph][2]; sub.textContent=phases[ph][3];
      if(s===phases[ph][1]) speak(phases[ph][4]);   // 각 구간 시작에 한 번만 안내
      s--;
      if(s<0){ ph++; if(ph>=phases.length){ ph=0; r++; if(r>=rounds){ done(); return; } } s=phases[ph][1]; }
      setTimeout(tick,1000);
    }
    tick();
  };
}

  const payload=JSON.stringify({app:'simjios', ver:1, exportedAt:new Date().toISOString(), data:JSON.parse(raw)});
  const d=DB.localDate().replace(/-/g,'');
  const blob=new Blob([payload],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='심지OS_백업_'+d+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },2000);

  logEvent('backup_export',{});
}
function importData(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=function(){

    const rd=new FileReader();
    rd.onload=function(){
      try{
        const obj=JSON.parse(rd.result);
        if(!obj || obj.app!=='simjios' || !obj.data){ alert('심지OS 백업 파일이 아니에요.'); return; }
        const when=(obj.exportedAt||'').slice(0,10);
        if(confirm('이 백업'+(when?'('+when+' 저장)':'')+'으로 기록을 복원할까요?\n지금 기기의 기록은 백업 내용으로 바뀝니다.')){
          localStorage.setItem(DB._key(), JSON.stringify(obj.data));
          location.reload();
        }
      }catch(e){ alert('파일을 읽지 못했어요. 백업 파일이 맞는지 확인해 주세요.'); }
    };
    rd.readAsText(f);
  };
  inp.click();
}

/* ---------- AI 응답 청소·검증 (형식 이탈 방어) ---------- */
function sanitizeAI(t){
  if(!t) return '';
  t=String(t);
  t=t.replace(/```[\s\S]*?```/g,' ');
  t=t.replace(/[\*#_`~>]+/g,'');
  t=t.replace(/[\[\]{}<>]/g,'');
  t=t.replace(/^\s*(json|output|response|응답|답변|아이|부모)\s*[:：]/i,'');
  t=t.replace(/\s+/g,' ').trim();
  return t;
}
function looksComplete(t){
  if(!t) return false; t=String(t).trim();
  return /[.!?…~)\u201d\u2019]$/.test(t) || /[다요네야아어지께까]$/.test(t) || /(구나|거야|잖아|볼까|할래|좋아|있어|했어|줬어|냈어|간다|온다)$/.test(t);
}
function aiKoreanOk(t){
  if(!t) return false;
  const ko=(t.match(/[가-힣]/g)||[]).length;
  if(ko<4) return false;
  if(/Mind|Feeling|Parent|Child|Response|System/i.test(t)) return false;
  if(t.length>220) return false;
  return true;
}

  showOverlay('<div style="font-size:36px;margin-bottom:6px">🌟</div><h2>'+(voc?voc+', ':'')+'요즘 너의 꿈은 뭐야?</h2>'
    +'<p>되고 싶은 모습, 해보고 싶은 것, 뭐든 좋아.<br>꿈은 바뀌어도 괜찮아 — 바뀐 꿈도 전부 너의 길이야.</p>'

function saveDream(btn){
  const v=(document.getElementById('dream-in').value||'').trim();
  if(!v){ toast('한 단어라도 좋아 — 적어볼까?'); return; }
  if(v===DB.currentDream()){ btn.closest('.ovl').remove(); return; }
  DB.setDream(v); logEvent('dream',{});
  btn.closest('.ovl').remove(); renderMyRoom();
  const p=DB.profile(); toast('🌟 '+(p&&p.name?vocative(p.name)+', ':'')+'멋진 꿈이 담겼어');
}

/* ---------- 이메일 로그인 · 7일 체험 · 아이이름 동기화 (B 모델) ---------- */
function getEmail(){ return localStorage.getItem('simji_email')||''; }
function setEmail(e){ if(e) localStorage.setItem('simji_email', e); }
function memberLogin(email, cb){
  fetch('/member/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email})})
    .then(function(r){return r.json();}).then(cb).catch(function(){ cb(null); });
}
function syncProfileToServer(){
  var email=getEmail(); var p=DB.profile(); if(!email||!p) return;
  fetch('/member/profile',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({email:email, childName:p.name||'', childGrade:p.grade||'', childBand:p.band||''})}).catch(function(){});
}
function applyMember(email, d){
  setEmail(email);
  if(d && d.status==='active'){ localStorage.setItem('simji_subscribed','1'); }
  else { localStorage.removeItem('simji_subscribed'); }
  if(d && typeof d.trialDaysLeft==='number'){ localStorage.setItem('simji_trial_left', String(d.trialDaysLeft)); }
      if(d && typeof d.trialDaysTotal==='number'){ localStorage.setItem('simji_trial_total', String(d.trialDaysTotal)); }
  if(d && d.status){ localStorage.setItem('simji_status', d.status); }
  // 서버에 저장된 아이 이름(다른 기기 동기화) → 로컬에 없을 때만 반영
  if(d && d.childName && !DB.profile()){ DB.setProfile(d.childName, d.childBand||'elem', d.childGrade||''); }
}
function submitLogin(btn){
  var el=document.getElementById('login-email'); var email=(el?el.value:'').trim().toLowerCase();
  var pel=document.getElementById('login-phone'); var phone=(pel?pel.value:'').replace(/[^0-9]/g,'');
  if(!/\S+@\S+\.\S+/.test(email)){ if(el){ el.placeholder='이메일을 정확히 입력해줘요'; el.style.borderColor='#E5484D'; } return; }
  if(phone.length<10){ if(pel){ pel.placeholder='휴대폰 번호를 정확히 (숫자만)'; pel.style.borderColor='#E5484D'; } return; }
  btn.disabled=true; btn.textContent='확인 중…';
  fetch('/member/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email, phone:phone})})
    .then(function(r){return r.json();}).then(function(d){
      if(!d || !d.ok){ btn.disabled=false; btn.textContent='시작하기'; alert((d&&d.message)||'연결이 잠깐 불안정해요. 잠시 후 다시 시도해 주세요.'); return; }
      applyMember(email, d);
      var o=btn.closest('.ovl'); if(o) o.remove();
      if(d.status==='expired'){ showExpiredScreen(email); return; }
      bootApp();
    }).catch(function(){ btn.disabled=false; btn.textContent='시작하기'; alert('연결이 잠깐 불안정해요. 잠시 후 다시 시도해 주세요.'); });
}
function findEmailPrompt(){
  var phone=prompt('가입하신 보호자 휴대폰 번호를 입력해 주세요. (숫자만)');
  if(!phone) return;
  phone=phone.replace(/[^0-9]/g,'');
  if(phone.length<10){ alert('휴대폰 번호를 정확히 입력해 주세요.'); return; }
  fetch('/member/find-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:phone})})
    .then(function(r){return r.json();}).then(function(d){
      if(!d || !d.ok){ alert((d&&d.message)||'잠시 후 다시 시도해 주세요.'); return; }
      if(!d.found){ alert('그 번호로 가입된 이메일을 찾지 못했어요.\n번호를 확인하시거나 카카오 채널로 문의해 주세요.'); return; }
      alert('가입하신 이메일은\n\n    '+d.hint+'\n\n입니다.\n앞부분을 참고해 로그인해 주세요.');
    }).catch(function(){ alert('조회 중 오류가 났어요. 잠시 후 다시 시도해 주세요.'); });
}
function showStartScreen(){
  showOverlay(
    '<div style="font-size:34px;margin-bottom:6px">🌱</div>'
    +'<h2>심지OS 시작하기</h2>'
    +'<p style="line-height:1.7">보호자 이메일과 휴대폰으로 시작해요. 처음이면 <b>7일 무료 체험</b>이 열리고, 이미 쓰던 분은 같은 이메일로 <b>어느 기기에서든</b> 이어서 쓸 수 있어요.</p>'
    +'<input id="login-email" type="email" inputmode="email" autocomplete="email" maxlength="120" placeholder="보호자 이메일 주소">'
    +'<input id="login-phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="20" placeholder="보호자 휴대폰 (010-0000-0000)" style="margin-top:8px">'
    +'<button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="submitLogin(this)">시작하기</button>'
    +'<button class="btn btn-ghost" style="width:100%;font-size:12px;color:#7A8A85;margin-top:4px" onclick="findEmailPrompt()">이메일을 잊으셨나요? 휴대폰으로 찾기</button>'
    +'<p style="margin-top:8px;font-size:11px;color:#7A8A85">구독 확인·결제·알림 안내에 쓰이는 정보예요. 자녀가 만 14세 미만이면 보호자 명의로 시작해 주세요.</p>'
    +'<p style="margin-top:6px;font-size:11px;color:#2F9E83;line-height:1.6">자녀가 여럿이면 지금은 아이마다 이메일로 가입해 주세요. 형제 통합(구독 하나로 여러 자녀·둘째부터 10% 할인)은 곧 제공됩니다 💛</p>'
  );
}
function showExpiredScreen(email){
  showOverlay(
    '<div style="font-size:34px;margin-bottom:6px">🌱</div>'
    +'<h2>무료 체험이 끝났어요</h2>'
    +'<p style="line-height:1.7">그동안 함께해줘서 고마워요. 아이의 기록은 <b>한 달간 안전하게 보관</b>돼요 — 지금 구독하면 그대로 이어집니다. <b>커피 한 잔 값</b>으로 매달 함께해요.</p>'
    +'<button class="btn btn-primary" style="width:100%;margin-bottom:8px" onclick="location.href=\'/subscribe\'">💛 구독하고 이어가기</button>'
    +'<div id="churn-box" style="margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);text-align:left">'
      +'<div style="font-size:13px;color:var(--muted);margin-bottom:10px">잠깐만요 — 계속 쓰지 않으신다면, <b>이유 하나만</b> 알려주실 수 있을까요? 더 나은 앱을 만드는 데 큰 도움이 됩니다.</div>'
      +churnBtn('busy','아이가 매일 하기 어려웠어요')
      +churnBtn('hard','아이에게 어려웠어요 (문장 쓰기 등)')
      +churnBtn('boring','아이가 흥미를 잃었어요')
      +churnBtn('price','가격이 부담돼요')
      +churnBtn('nochange','변화를 잘 못 느꼈어요')
      +churnBtn('other','다른 이유예요')
    +'</div>'
    +'<button class="btn btn-ghost" style="width:100%;font-size:12px;color:#7A8A85;margin-top:10px" onclick="switchEmail(this)">다른 이메일로 로그인</button>'
  );
}
function churnBtn(code,label){
  return '<div onclick="sendChurn(\''+code+'\')" style="cursor:pointer;font-size:13px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px">'+label+'</div>';
}
function sendChurn(code){
  try{ logEvent('churn_reason', { reason:code, at:'trial_expired' }); }catch(e){}
  const box=document.getElementById('churn-box');
  if(box) box.innerHTML='<div style="font-size:13px;color:var(--teal);padding:10px 0;text-align:center">알려주셔서 고맙습니다 💛<br>보내주신 의견은 앱을 고치는 데 쓰입니다.</div>';
}
function switchEmail(btn){
  var o=btn&&btn.closest('.ovl'); if(o) o.remove();
  localStorage.removeItem('simji_email'); localStorage.removeItem('simji_subscribed'); localStorage.removeItem('simji_status'); localStorage.removeItem('simji_trial_left');
  showStartScreen();
}
function startAuthFlow(){
  var email=getEmail();
  if(!email){ showStartScreen(); return; }
  memberLogin(email, function(d){
    if(!d || !d.ok){ bootApp(); return; }   // 서버 일시 오류 시 기존처럼 진입 허용
    applyMember(email, d);
    if(d.status==='expired'){ showExpiredScreen(email); return; }
    bootApp();
  });
}
function bootApp(){
  try{ ensureChildren(); renderChildLabel(); }catch(e){}
  maybeOnboard();
  if(DB.profile()) showWelcomeCard(false);
  checkMilestones(); checkGrowthMoments(); checkFruitMoments(); checkRunMoments(); checkYearBand();
}

/* ---------- Init ---------- */
(function(){
  var qs=location.search;
  var m=qs.match(/[?&]e=([^&]+)/);
  if(m){ try{ localStorage.setItem('simji_email', decodeURIComponent(m[1])); }catch(e){} }
  if(qs.indexOf('subscribed=1')>=0){ localStorage.setItem('simji_subscribed','1'); }
  if(m || qs.indexOf('subscribed=1')>=0){ try{ history.replaceState({},'',location.pathname); }catch(e){} }
})();
// 이메일 로그인 관문 → 상태 확인 후 앱 진입 (B 모델)
renderHome();
startAuthFlow();
</script>
